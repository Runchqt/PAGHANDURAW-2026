<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAGHANDURAW 2026 — Accomplishment Report</title>
<link rel="stylesheet" href="pageflip.css">
<style>
  :root{
    --ink:#1c1a17;
    --paper:#efe9df;
    --rust:#d9611f;
    --rust-deep:#b84c14;
    --amber:#f2a03d;
    --steel:#2c3e46;
    --line: rgba(28,26,23,0.14);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    overflow:hidden;
  }

  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }

  .app{
    position:relative;
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    background:var(--ink);
    color:var(--paper);
    z-index:20;
    border-bottom:3px solid var(--rust);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:0.14em;
    background:var(--rust);
    color:#fff;
    padding:4px 8px;
    border-radius:3px;
    text-transform:uppercase;
  }
  .brand .title{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .brand .title small{
    display:block;
    font-weight:400;
    font-size:10.5px;
    opacity:0.6;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:1px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tbtn{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:transparent;
    border:1px solid rgba(239,233,223,0.25);
    color:var(--paper);
    width:36px;
    height:36px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .tbtn:hover{
    background:rgba(239,233,223,0.1);
    border-color:rgba(239,233,223,0.45);
  }
  .tbtn:active{ transform:scale(0.94); }
  .tbtn svg{ width:17px; height:17px; }
  .tbtn.wide{
    width:auto;
    padding:0 14px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.03em;
    gap:7px;
  }

  /* ---------- Stage ---------- */
  .stage{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(217,97,31,0.10), transparent 60%),
      var(--paper);
  }

  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(28,26,23,0.025) 0px, rgba(28,26,23,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  #book-container{
    position:relative;
    z-index:2;
  }

  .page-img{
    width:100%;
    height:100%;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    background:#fff;
  }
  .stf__item{
    background:#fff;
  }

  .side-nav{
    position:absolute;
    top:0;
    bottom:0;
    width:14%;
    min-width:44px;
    max-width:120px;
    display:flex;
    align-items:center;
    z-index:5;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .stage:hover .side-nav{ opacity:0.55; }
  .side-nav:hover{ opacity:1 !important; }
  .side-nav.left{ left:0; justify-content:flex-start; padding-left:6px;}
  .side-nav.right{ right:0; justify-content:flex-end; padding-right:6px;}
  .side-nav svg{ width:30px; height:30px; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
  .side-nav:disabled{ display:none; }

  /* ---------- Footer / scrubber ---------- */
  footer{
    flex:0 0 auto;
    background:var(--ink);
    padding:10px 22px 14px;
    z-index:20;
    border-top:1px solid rgba(239,233,223,0.1);
  }
  .scrub-row{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:900px;
    margin:0 auto;
  }
  .page-indicator{
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    white-space:nowrap;
    min-width:64px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:2px;
    background:rgba(239,233,223,0.22);
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--rust);
    border:2px solid var(--paper);
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--rust);
    border:2px solid var(--paper);
    cursor:pointer;
  }

  /* ---------- Loading ---------- */
  .loader{
    position:fixed;
    inset:0;
    background:var(--ink);
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    transition:opacity 0.5s ease;
  }
  .loader.hide{ opacity:0; pointer-events:none; }
  .loader-mark{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.2em;
    color:var(--paper);
    text-transform:uppercase;
  }
  .loader-mark span{ color:var(--rust); }
  .loader-bar{
    width:180px;
    height:3px;
    background:rgba(239,233,223,0.15);
    border-radius:2px;
    overflow:hidden;
  }
  .loader-bar i{
    display:block;
    height:100%;
    width:35%;
    background:var(--rust);
    border-radius:2px;
    animation:load-sweep 1.1s ease-in-out infinite;
  }
  @keyframes load-sweep{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(380%); }
  }

  /* ---------- Hint ---------- */
  .hint{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(28,26,23,0.82);
    color:var(--paper);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:20px;
    z-index:8;
    pointer-events:none;
    opacity:1;
    transition:opacity 0.6s ease 2.4s;
    white-space:nowrap;
  }
  .hint.fade{ opacity:0; }

  @media (max-width:640px){
    header{ padding:10px 12px; }
    .brand .title{ font-size:12.5px; }
    .brand .title small{ font-size:9px; }
    .tbtn{ width:32px; height:32px; }
    .tbtn.wide span.label{ display:none; }
    .tbtn.wide{ padding:0 10px; }
    footer{ padding:8px 12px 12px; }
    .page-indicator{ font-size:11px; min-width:50px; }
    .hint{ font-size:10.5px; padding:7px 12px; bottom:10px;}
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-mark">PAGHANDURAW<span>.</span> 2026</div>
  <div class="loader-bar"><i></i></div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <span class="mark">ESO</span>
      <span class="title">Accomplishment Report<small>Engineering Students Organization · MSU-GSC</small></span>
    </div>
    <div class="toolbar">
      <button class="tbtn wide" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span class="label">Fullscreen</span>
      </button>

    </div>
  </header>

  <div class="stage" id="stage">
    <button class="side-nav left" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div id="book-container"></div>

    <button class="side-nav right" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="hint" id="hint">Click a page edge or drag a corner to flip</div>
  </div>

  <footer>
    <div class="scrub-row">
      <span class="page-indicator" id="pageIndicator">1 / 21</span>
      <input type="range" id="scrubber" min="1" max="21" value="1" step="1" aria-label="Jump to page">
    </div>
  </footer>
</div>

<script src="pageflip.js"></script>
<script>
(function(){
  const TOTAL_PAGES = 21;
  const pad = n => String(n).padStart(2,'0');
  const pageUrls = Array.from({length:TOTAL_PAGES}, (_,i)=>`pages/page-${pad(i+1)}.jpg`);

  const container = document.getElementById('book-container');
  const stage = document.getElementById('stage');
  const loader = document.getElementById('loader');
  const hint = document.getElementById('hint');
  const pageIndicator = document.getElementById('pageIndicator');
  const scrubber = document.getElementById('scrubber');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // A4 single-page ratio (width/height), matching page-01 / page-21 covers exactly
  const SINGLE_RATIO = 1241 / 1755;

  function computeSize(){
    const w = stage.clientWidth;
    const h = stage.clientHeight - 24;

    // The book's "page" unit in showCover mode is always a SINGLE page's
    // dimensions. Spreads are just two of these placed side by side.
    // So we size based on the single-page ratio, then make sure a full
    // spread (2x this width) still fits the available width.
    let pageH = h;
    let pageW = pageH * SINGLE_RATIO;

    const maxSpreadW = w * 0.94;
    if (pageW * 2 > maxSpreadW){
      pageW = maxSpreadW / 2;
      pageH = pageW / SINGLE_RATIO;
    }

    return {
      width: Math.floor(pageW),
      height: Math.floor(pageH)
    };
  }

  const size = computeSize();

  const pageFlip = new St.PageFlip(container, {
    width: size.width,
    height: size.height,
    size: 'fixed',
    minWidth: 220,
    maxWidth: 1400,
    minHeight: 300,
    maxHeight: 2000,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: false,
    usePortrait: false,
    autoSize: false,
    drawShadow: true,
    flippingTime: 700,
    useMouseEvents: true
  });

  pageFlip.loadFromImages(pageUrls);

  pageFlip.on('flip', (e) => {
    updateIndicator(e.data + 1);
  });

  pageFlip.on('init', () => {
    setTimeout(()=>{ loader.classList.add('hide'); }, 350);
    setTimeout(()=>{ hint.classList.add('fade'); }, 100);
  });

  function updateIndicator(current){
    pageIndicator.textContent = `${current} / ${TOTAL_PAGES}`;
    scrubber.value = current;
  }

  prevBtn.addEventListener('click', ()=> pageFlip.flipPrev());
  nextBtn.addEventListener('click', ()=> pageFlip.flipNext());

  scrubber.addEventListener('input', (e)=>{
    const idx = parseInt(e.target.value,10) - 1;
    pageFlip.flip(idx);
    pageIndicator.textContent = `${e.target.value} / ${TOTAL_PAGES}`;
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight') pageFlip.flipNext();
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  // Fullscreen
  fullscreenBtn.addEventListener('click', ()=>{
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  // Resize handling
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const s = computeSize();
      pageFlip.updateSettings({ width: s.width, height: s.height });
    }, 150);
  });

  // Fallback: hide loader after 6s regardless
  setTimeout(()=> loader.classList.add('hide'), 6000);
})();
</script>
</body>
</html>
