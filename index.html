<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAGHANDURAW 2026 — Accomplishment Report</title>

<!-- Preloads cover immediately for fast loading -->
<link rel="preload" as="image" href="page-01.jpg">

<link rel="stylesheet" href="pageflip.css">
<style>
  :root{
    --ink:#1c1a17;
    --paper:#efe9df;
    --rust:#d9611f;
    --rust-deep:#b84c14;
    --amber:#f2a03d;
    --steel:#2c3e46;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    overflow:hidden;
  }

  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }

  .app{
    position:relative;
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    background:var(--ink);
    color:var(--paper);
    z-index:20;
    border-bottom:3px solid var(--rust);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:0.14em;
    background:var(--rust);
    color:#fff;
    padding:4px 8px;
    border-radius:3px;
    text-transform:uppercase;
  }
  .brand .title{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
  }
  .brand .title small{
    display:block;
    font-weight:400;
    font-size:10.5px;
    opacity:0.6;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:1px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tbtn{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:transparent;
    border:1px solid rgba(239,233,223,0.25);
    color:var(--paper);
    width:36px;
    height:36px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .tbtn:hover{
    background:rgba(239,233,223,0.1);
    border-color:rgba(239,233,223,0.45);
  }
  .tbtn:active{ transform:scale(0.94); }
  .tbtn.active {
    background: rgba(217,97,31,0.2);
    border-color: var(--rust);
    color: var(--amber);
  }
  .tbtn svg{ width:17px; height:17px; }
  .tbtn.wide{
    width:auto;
    padding:0 14px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.03em;
    gap:7px;
  }

  /* ---------- Stage ---------- */
  .stage{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(217,97,31,0.10), transparent 60%),
      var(--paper);
  }

  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(28,26,23,0.025) 0px, rgba(28,26,23,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  #book-container{
    position:relative;
    z-index:2;
  }

  .side-nav{
    position:absolute;
    top:0;
    bottom:0;
    width:14%;
    min-width:44px;
    max-width:120px;
    display:flex;
    align-items:center;
    z-index:5;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .stage:hover .side-nav{ opacity:0.55; }
  .side-nav:hover{ opacity:1 !important; }
  .side-nav.left{ left:0; justify-content:flex-start; padding-left:6px;}
  .side-nav.right{ right:0; justify-content:flex-end; padding-right:6px;}
  .side-nav svg{ width:30px; height:30px; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
  .side-nav:disabled{ display:none; }

  /* ---------- Footer / scrubber ---------- */
  footer{
    flex:0 0 auto;
    background:var(--ink);
    padding:10px 22px 14px;
    z-index:20;
    border-top:1px solid rgba(239,233,223,0.1);
  }
  .scrub-row{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:900px;
    margin:0 auto;
  }
  .page-indicator{
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--paper);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    white-space:nowrap;
    min-width:64px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:2px;
    background:rgba(239,233,223,0.22);
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--rust);
    border:2px solid var(--paper);
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--rust);
    border:2px solid var(--paper);
    cursor:pointer;
  }

  /* ---------- Loading ---------- */
  .loader{
    position:fixed;
    inset:0;
    background:var(--ink);
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    transition:opacity 0.4s ease;
  }
  .loader.hide{ opacity:0; pointer-events:none; }
  .loader-mark{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.2em;
    color:var(--paper);
    text-transform:uppercase;
  }
  .loader-mark span{ color:var(--rust); }
  .loader-bar{
    width:180px;
    height:3px;
    background:rgba(239,233,223,0.15);
    border-radius:2px;
    overflow:hidden;
  }
  .loader-bar i{
    display:block;
    height:100%;
    width:35%;
    background:var(--rust);
    border-radius:2px;
    animation:load-sweep 1.1s ease-in-out infinite;
  }
  @keyframes load-sweep{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(380%); }
  }

  /* ---------- Hint ---------- */
  .hint{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(28,26,23,0.82);
    color:var(--paper);
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:20px;
    z-index:8;
    pointer-events:none;
    opacity:1;
    transition:opacity 0.6s ease 2.4s;
    white-space:nowrap;
  }
  .hint.fade{ opacity:0; }

  @media (max-width:640px){
    header{ padding:10px 12px; }
    .brand .title{ font-size:12.5px; }
    .brand .title small{ font-size:9px; }
    .tbtn{ width:32px; height:32px; }
    .tbtn.wide span.label{ display:none; }
    .tbtn.wide{ padding:0 10px; }
    footer{ padding:8px 12px 12px; }
    .page-indicator{ font-size:11px; min-width:50px; }
    .hint{ font-size:10.5px; padding:7px 12px; bottom:10px;}
  }

  /* ---------- Perfect Image Cropping Classes ---------- */
  .page-wrapper {
    position: relative;
    background-color: #ffffff;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .page-wrapper img {
    position: absolute;
    top: 0;
    height: 100%;
    max-width: none !important;
    pointer-events: none;
    -webkit-user-drag: none;
    /* Force high-quality downscaling: */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: high-quality;
  }
  .img-single {
    left: 0;
    width: 100%;
    object-fit: cover; 
  }
  .img-spread-left {
    left: 0;
    width: 200%;
    object-fit: cover;
  }
  .img-spread-right {
    left: -100%;
    width: 200%;
    object-fit: cover;
  }

  /* ---------- Magnifying Glass ---------- */
  #magnifier {
    position: fixed;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid var(--rust);
    background-color: var(--paper);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.2);
    pointer-events: none; /* Allows you to click and flip through the glass! */
    z-index: 9999;
    display: none;
    background-repeat: no-repeat;
    image-rendering: high-quality;
  }
  #magnifier.active {
    display: block;
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-mark">PAGHANDURAW<span>.</span> 2026</div>
  <div class="loader-bar"><i></i></div>
</div>

<!-- Magnifier Tool -->
<div id="magnifier"></div>

<div class="app">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo" style="height: 40px; width: auto; object-fit: contain;">
      <span class="title">Accomplishment Report 2025-2026<small>Engineering Students Organization · MSU-GenSan</small></span>
    </div>
    <div class="toolbar">
      <!-- New Zoom Button -->
      <button class="tbtn wide" id="magBtn" title="Magnifying Glass" aria-label="Toggle Magnifier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        <span class="label">Zoom</span>
      </button>

      <button class="tbtn wide" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <span class="label">Fullscreen</span>
      </button>
    </div>
  </header>

  <div class="stage" id="stage">
    <button class="side-nav left" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div id="book-container"></div>

    <button class="side-nav right" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="hint" id="hint">Click a page edge or drag a corner to flip</div>
  </div>

  <footer>
    <div class="scrub-row">
      <span class="page-indicator" id="pageIndicator">1 / 40</span>
      <input type="range" id="scrubber" min="1" max="40" value="1" step="1" aria-label="Jump to page">
    </div>
  </footer>
</div>

<script src="pageflip.js"></script>
<script>
(function(){
  const TOTAL_IMAGE_FILES = 21;
  const pad = n => String(n).padStart(2,'0');
  const imageUrls = Array.from({length: TOTAL_IMAGE_FILES}, (_,i)=>`page-${pad(i+1)}.jpg`);

  const container = document.getElementById('book-container');
  const stage = document.getElementById('stage');
  const loader = document.getElementById('loader');
  const hint = document.getElementById('hint');
  const pageIndicator = document.getElementById('pageIndicator');
  const scrubber = document.getElementById('scrubber');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  // Build the DOM nodes and PROTECT the real <img> tags with a wrapper
  imageUrls.forEach((url, index) => {
    if (index === 0 || index === TOTAL_IMAGE_FILES - 1) {
      // FRONT COVER & BACK COVER
      const wrapper = document.createElement('div'); 
      wrapper.className = 'page-wrapper';
      const img = document.createElement('img'); 
      img.src = url;
      img.className = 'img-single';
      wrapper.appendChild(img);
      container.appendChild(wrapper);
    } else {
      // MIDDLE SPREADS - Cut cleanly without squishing
      const wrapperLeft = document.createElement('div');
      wrapperLeft.className = 'page-wrapper';
      const imgLeft = document.createElement('img');
      imgLeft.src = url;
      imgLeft.className = 'img-spread-left';
      wrapperLeft.appendChild(imgLeft);
      container.appendChild(wrapperLeft);

      const wrapperRight = document.createElement('div');
      wrapperRight.className = 'page-wrapper';
      const imgRight = document.createElement('img');
      imgRight.src = url;
      imgRight.className = 'img-spread-right';
      wrapperRight.appendChild(imgRight);
      container.appendChild(wrapperRight);
    }
  });

  const TOTAL_PAGES = container.children.length; 
  const SINGLE_RATIO = 3125 / 4420;

  function computeSize(){
    const w = stage.clientWidth;
    const h = stage.clientHeight - 24;

    let pageH = h;
    let pageW = pageH * SINGLE_RATIO;
    const maxSpreadW = w * 0.94;
    
    if (pageW * 2 > maxSpreadW){
      pageW = maxSpreadW / 2;
      pageH = pageW / SINGLE_RATIO;
    }

    return {
      width: Math.floor(pageW),
      height: Math.floor(pageH)
    };
  }

  const size = computeSize();

  const pageFlip = new St.PageFlip(container, {
    width: size.width,
    height: size.height,
    size: 'fixed',
    minWidth: 220,
    maxWidth: 1400,
    minHeight: 300,
    maxHeight: 2000,
    maxShadowOpacity: 0.5,
    showCover: true, 
    mobileScrollSupport: false,
    usePortrait: false, // Locks into the 2-page landscape spread permanently!
    autoSize: false,
    drawShadow: true,
    flippingTime: 700,
    useMouseEvents: true
  });

  pageFlip.loadFromHTML(document.querySelectorAll('#book-container > div'));

  // FAST LOAD TRIGGER: Dismiss loader the moment the cover image finishes downloading
  const coverImg = new Image();
  coverImg.src = 'page-01.jpg';
  const dismissLoader = () => {
    loader.classList.add('hide');
    hint.classList.add('fade');
  };

  if (coverImg.complete) {
    dismissLoader();
  } else {
    coverImg.onload = dismissLoader;
    coverImg.onerror = dismissLoader;
  }

  pageFlip.on('flip', (e) => {
    updateIndicator(e.data + 1);
  });

  function updateIndicator(current){
    pageIndicator.textContent = `${current} / ${TOTAL_PAGES}`;
    scrubber.max = TOTAL_PAGES;
    scrubber.value = current;
  }

  prevBtn.addEventListener('click', ()=> pageFlip.flipPrev());
  nextBtn.addEventListener('click', ()=> pageFlip.flipNext());

  scrubber.addEventListener('input', (e)=>{
    const idx = parseInt(e.target.value,10) - 1;
    pageFlip.flip(idx);
    pageIndicator.textContent = `${e.target.value} / ${TOTAL_PAGES}`;
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight') pageFlip.flipNext();
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  fullscreenBtn.addEventListener('click', ()=>{
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const s = computeSize();
      pageFlip.updateSettings({ width: s.width, height: s.height });
    }, 150);
  });


  /* =========================================
     MAGNIFYING GLASS LOGIC
     ========================================= */
  const magBtn = document.getElementById('magBtn');
  const magnifier = document.getElementById('magnifier');
  let isMagActive = false;
  
  const MAG_SIZE = 220; 
  const MAG_RADIUS = MAG_SIZE / 2;
  const ZOOM_LEVEL = 2.5; // Adjust this number to zoom in closer or further

  magBtn.addEventListener('click', () => {
    isMagActive = !isMagActive;
    magBtn.classList.toggle('active', isMagActive);
    if (!isMagActive) magnifier.classList.remove('active');
  });

  function handleMagnifierMove(e) {
    if (!isMagActive) return;

    // Support both mouse and touch tracking
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    // If using touch, pop the glass slightly above the finger so it isn't hidden
    const touchOffset = e.touches ? (MAG_RADIUS + 40) : MAG_RADIUS;

    // Dig through the overlapping layers to find the actual page underneath
    const elements = document.elementsFromPoint(clientX, clientY);
    const wrapper = elements.find(el => el.classList.contains('page-wrapper'));

    if (wrapper) {
      magnifier.classList.add('active');

      // Move magnifier to follow the cursor/finger
      magnifier.style.left = (clientX - MAG_RADIUS) + 'px';
      magnifier.style.top = (clientY - touchOffset) + 'px';

      const imgEl = wrapper.querySelector('img');
      if (!imgEl) return;

      const rect = wrapper.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      magnifier.style.backgroundImage = `url('${imgEl.src}')`;

      // Smart calculation to perfectly align the left/right sliced image inside the glass
      if (imgEl.classList.contains('img-single')) {
        magnifier.style.backgroundSize = `${rect.width * ZOOM_LEVEL}px ${rect.height * ZOOM_LEVEL}px`;
        magnifier.style.backgroundPosition = `-${(x * ZOOM_LEVEL) - MAG_RADIUS}px -${(y * ZOOM_LEVEL) - MAG_RADIUS}px`;
      } 
      else if (imgEl.classList.contains('img-spread-left')) {
        magnifier.style.backgroundSize = `${rect.width * 2 * ZOOM_LEVEL}px ${rect.height * ZOOM_LEVEL}px`;
        magnifier.style.backgroundPosition = `-${(x * ZOOM_LEVEL) - MAG_RADIUS}px -${(y * ZOOM_LEVEL) - MAG_RADIUS}px`;
      } 
      else if (imgEl.classList.contains('img-spread-right')) {
        magnifier.style.backgroundSize = `${rect.width * 2 * ZOOM_LEVEL}px ${rect.height * ZOOM_LEVEL}px`;
        magnifier.style.backgroundPosition = `-${((x + rect.width) * ZOOM_LEVEL) - MAG_RADIUS}px -${(y * ZOOM_LEVEL) - MAG_RADIUS}px`;
      }
    } else {
      magnifier.classList.remove('active');
    }
  }

  document.addEventListener('mousemove', handleMagnifierMove);
  document.addEventListener('touchmove', handleMagnifierMove, {passive: true});
  
  // Hide the glass when the finger leaves the screen
  document.addEventListener('touchend', () => {
    if(isMagActive) magnifier.classList.remove('active');
  });

  setTimeout(dismissLoader, 6000);
})();
</script>
</body>
</html>
